<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — MegaRemates</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="survey-container" id="app">
        <div class="dashboard">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:24px;">
                <div>
                    <h1 style="font-size:22px; margin-bottom:4px;">Panel Administrativo</h1>
                    <p style="color:#5b6f82; font-size:14px;">Conectado como: <strong id="userEmail">...</strong></p>
                </div>
                <button id="logoutBtn" class="btn btn-secondary" style="flex:none; padding:8px 20px; font-size:14px;">Cerrar sesión</button>
            </div>

            <div style="text-align:center; padding:60px 20px; color:#5b6f82;">
                <p style="font-size:18px; margin-bottom:8px;">🚧 Dashboard en construcción</p>
                <p style="font-size:14px;">Próximas funcionalidades: gráficos, filtros por tipo de encuesta, exportación a CSV.</p>
            </div>
        </div>
    </div>

    <script src="/dashboard/dashboard.js" defer></script>
</body>
</html>
