<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — MegaRemates</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="survey-container" id="app">
        <div class="login-form">
            <div style="text-align:center; margin-bottom:24px;">
                <img src="/images/megaremates.svg" alt="MegaRemates" style="max-width:120px; margin-bottom:16px;">
                <h1 style="font-size:22px; margin-bottom:4px;">Iniciar sesión</h1>
                <p style="color:#5b6f82; font-size:14px;">Acceso al panel administrativo</p>
            </div>

            <form id="loginForm" autocomplete="on">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required placeholder="admin@megaremates.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
                </div>
                <div id="loginError" class="login-error" style="display:none;"></div>
                <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%;">Iniciar sesión</button>
            </form>
        </div>
    </div>

    <script src="/login/auth.js" defer></script>
</body>
</html>
