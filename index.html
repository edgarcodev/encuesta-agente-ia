<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega Remates · Encuesta Compradores v1.3</title>
    <style>
        /* Estilos (sin cambios) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: #f4f7fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .survey-container {
            max-width: 720px;
            width: 100%;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 8px 24px rgba(0, 0, 0, 0.04);
            padding: 32px 28px;
            transition: all 0.2s;
        }
        .survey-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .survey-header h1 {
            font-size: 20px;
            font-weight: 700;
            color: #1a2634;
            letter-spacing: -0.3px;
        }
        .survey-header .step-counter {
            font-size: 14px;
            font-weight: 500;
            color: #5b6f82;
            background: #eef2f7;
            padding: 4px 14px;
            border-radius: 40px;
        }
        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: #e6ecf3;
            border-radius: 10px;
            margin-bottom: 28px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #f97316, #f59e0b);
            border-radius: 10px;
            transition: width 0.35s ease;
            width: 0%;
        }
        .question-area {
            min-height: 240px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .question-text {
            font-size: 20px;
            font-weight: 600;
            color: #0b1a2a;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        .question-text .sub-label {
            font-weight: 400;
            font-size: 14px;
            color: #5b6f82;
            display: block;
            margin-top: 4px;
        }
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 8px;
        }
        .options-group label {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 16px;
            color: #1e2a36;
            padding: 10px 14px;
            background: #f8faff;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.15s;
            flex-wrap: wrap;
        }
        .options-group label:hover {
            background: #f0f4fe;
            border-color: #cbd5e1;
        }
        .options-group input[type="radio"],
        .options-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #f97316;
            flex-shrink: 0;
            cursor: pointer;
        }
        .options-group label.selected {
            background: #fef3e8;
            border-color: #f97316;
            box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.15);
        }
        .text-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 14px;
            background: #fafcff;
            transition: 0.15s;
            font-family: inherit;
            resize: vertical;
        }
        .text-input:focus {
            outline: none;
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.12);
        }
        .text-input.textarea {
            min-height: 90px;
        }
        .otro-input {
            flex: 1;
            min-width: 120px;
            padding: 6px 12px;
            border: 1.5px solid #dce2ec;
            border-radius: 40px;
            font-size: 14px;
            background: white;
            transition: 0.15s;
        }
        .otro-input:focus {
            border-color: #f97316;
            outline: none;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.12);
        }
        .navigation {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid #e9eef4;
        }
        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            background: #f1f4f9;
            color: #1e2a36;
            flex: 1;
            text-align: center;
        }
        .btn-primary {
            background: #f97316;
            color: white;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.25);
        }
        .btn-primary:hover {
            background: #ea5a0a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .btn-secondary {
            background: #eef2f7;
        }
        .btn-secondary:hover {
            background: #e2e8f0;
        }
        .btn-secondary:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .btn-success {
            background: #22a65e;
            color: white;
            box-shadow: 0 4px 12px rgba(34, 166, 94, 0.25);
        }
        .btn-success:hover {
            background: #1a8a4e;
            transform: translateY(-2px);
        }
        .btn-success:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .summary {
            padding: 8px 0;
        }
        .summary-item {
            padding: 14px 0;
            border-bottom: 1px solid #eef2f7;
        }
        .summary-item:last-child {
            border-bottom: none;
        }
        .summary-item strong {
            display: block;
            font-weight: 600;
            color: #1a2634;
            margin-bottom: 4px;
        }
        .summary-item .answer {
            color: #2d3f52;
            background: #f5f8fe;
            padding: 6px 14px;
            border-radius: 40px;
            display: inline-block;
            font-size: 14px;
        }
        .summary-item .answer.multi {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .summary-item .answer.multi span {
            background: #f5f8fe;
            padding: 4px 14px;
            border-radius: 40px;
        }
        .alert {
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 16px;
            font-weight: 500;
        }
        .alert-success {
            background: #e6f7e6;
            color: #0e5e2e;
        }
        .alert-error {
            background: #fde8e8;
            color: #a12b2b;
        }
        .alert-info {
            background: #fef3e8;
            color: #8a4a0a;
        }
        .hidden {
            display: none !important;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #f97316;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @media (max-width: 480px) {
            .survey-container {
                padding: 20px 16px;
            }
            .question-text {
                font-size: 18px;
            }
            .btn {
                padding: 12px 18px;
                font-size: 15px;
            }
            .options-group label {
                padding: 10px 12px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="survey-container" id="app">
        <div class="survey-header">
            <h1>📦 Mega Remates</h1>
            <span class="step-counter" id="stepCounter">Paso 1</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div id="dynamicArea"></div>
    </div>

    <script>
        (function() {
            'use strict';

            // ================================================================
            //  GENERACIÓN DE NONCE (token de sesión)
            // ================================================================
            const NONCE = (() => {
                let n = sessionStorage.getItem('encuesta_nonce');
                if (!n) {
                    n = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                    sessionStorage.setItem('encuesta_nonce', n);
                }
                return n;
            })();

            // ================================================================
            //  CONFIGURACIÓN (ya no se necesitan claves en el cliente)
            // ================================================================

            // Clave para localStorage (evitar duplicados)
            const STORAGE_KEY = 'megaremates_encuesta_enviada';

            // Variables de control
            let datosEnviados = false;
            let geoData = null;

            // --- Variables de comportamiento ---
            const inicioEncuesta = new Date();
            const tiemposPorPregunta = {};
            let preguntaActualId = null;
            let inicioPregunta = null;

            // Metadatos
            let fuente = 'desconocida';
            let dispositivo = 'desktop';
            let conexion = {};

            // ------------------------------------------------------------
            // 1. DEFINICIÓN DE PASOS (26 preguntas + condicionales)
            // ------------------------------------------------------------
            const steps = [];

            function opts(arr) {
                return arr.map(label => ({ label, value: label }));
            }

            const answers = {};

            // --- BLOQUE A: PERFIL (1-3) ---
            steps.push({
                id: 'p1',
                question: '1. ¿Qué compras habitualmente? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Alimentos y bebidas', 'Ropa y calzado', 'Tecnología/celulares',
                    'Productos para el hogar', 'Repuestos/automotriz', 'Construcción/herramientas',
                    'Belleza/salud', 'Productos para mi negocio', 'Productos para revender',
                    'Servicios', 'Productos digitales', 'Otros'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p2',
                question: '2. ¿Para quién compras principalmente?',
                type: 'radio',
                options: opts([
                    'Para mí', 'Para mi familia', 'Para mi negocio',
                    'Para revender', 'Para una empresa/institución', 'Para otra persona',
                    'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p3',
                question: '3. ¿Con qué frecuencia realizas compras de productos o servicios?',
                type: 'radio',
                options: opts([
                    'Todos los días', 'Varias veces por semana', 'Una vez por semana',
                    'Varias veces al mes', 'Una vez al mes', 'Menos de una vez al mes'
                ]),
                condition: () => true
            });

            // --- BLOQUE B: COMPORTAMIENTO REAL (4-8) ---
            steps.push({
                id: 'p4',
                question: '4. Pensando en tu última compra, ¿qué compraste? (respuesta abierta)',
                type: 'textarea',
                placeholder: 'Describe el producto o servicio...',
                condition: () => true
            });

            steps.push({
                id: 'p5',
                question: '5. ¿Dónde realizaste esa compra? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Tienda/mercado físico', 'Facebook/Marketplace', 'WhatsApp',
                    'Instagram/TikTok', 'Página web', 'Aplicación',
                    'Recomendación de una persona', 'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p6',
                question: '6. Aproximadamente, ¿cuánto gastaste en esa compra?',
                type: 'radio',
                options: opts([
                    'Menos de S/20', 'S/20–50', 'S/51–100', 'S/101–300',
                    'S/301–500', 'S/501–1,000', 'Más de S/1,000', 'Prefiero no responder'
                ]),
                condition: () => true
            });

            steps.push({
                id: 'p7',
                question: '7. ¿Cómo realizaste el pago? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Efectivo', 'Yape', 'Plin', 'Transferencia bancaria',
                    'Tarjeta', 'PayPal', 'Fiado', 'Cuotas',
                    'Adelanto + saldo', 'Letras', 'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p8',
                question: '8. ¿Por qué elegiste ese vendedor, negocio o proveedor? (respuesta abierta)',
                type: 'textarea',
                placeholder: 'Cuéntanos tu motivo...',
                condition: () => true
            });

            // --- BLOQUE C: OFERTAS, REMATES Y CONFIANZA (9-12) ---
            steps.push({
                id: 'p9',
                question: '9. Cuando buscas una buena oferta, ¿qué haces normalmente? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Comparo precios', 'Pregunto a familiares/amigos',
                    'Busco en Facebook/Marketplace', 'Pregunto por WhatsApp',
                    'Busco en Instagram/TikTok', 'Visito tiendas o mercados',
                    'Busco promociones', 'Busco remates/liquidaciones',
                    'Espero ofertas', 'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p10',
                question: '10. ¿Has comprado alguna vez un producto o servicio en remate, liquidación u oferta especial?',
                type: 'radio',
                options: opts(['Sí', 'No']),
                condition: () => true
            });

            steps.push({
                id: 'p10_si',
                question: '¿Qué compraste y cómo fue la experiencia? (respuesta abierta)',
                type: 'textarea',
                placeholder: 'Cuéntanos...',
                condition: () => answers.p10 === 'Sí'
            });

            steps.push({
                id: 'p10_no',
                question: '¿Qué te ha impedido comprar en remates o liquidaciones? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Desconfianza', 'No sé dónde encontrarlos',
                    'No sé si el descuento es real', 'Miedo a productos defectuosos',
                    'Miedo a estafas', 'No conozco bien cómo funcionan',
                    'Nunca lo he necesitado', 'Otro'
                ]),
                allowOther: true,
                condition: () => answers.p10 === 'No'
            });

            steps.push({
                id: 'p11',
                question: '11. ¿Qué es lo que más te preocupa cuando compras a alguien que no conoces? (selecciona hasta 3)',
                type: 'checkbox',
                options: opts([
                    'Que sea una estafa', 'Que el producto sea diferente al anunciado',
                    'Que esté defectuoso', 'Que sea falsificado',
                    'Que esté vencido', 'Que no me entreguen el producto',
                    'No poder recuperar mi dinero', 'Que el precio real sea diferente al anunciado',
                    'Que mis datos sean utilizados indebidamente', 'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p12',
                question: '12. ¿Has tenido alguna mala experiencia comprando por Internet o redes sociales?',
                type: 'radio',
                options: opts(['Sí', 'No']),
                condition: () => true
            });

            steps.push({
                id: 'p12_si',
                question: '¿Qué ocurrió? (describe brevemente)',
                type: 'textarea',
                placeholder: 'Cuéntanos tu experiencia...',
                condition: () => answers.p12 === 'Sí'
            });

            // --- BLOQUE D: CALIDAD, CRÉDITO, COMPRA GRUPAL (13-15) ---
            steps.push({
                id: 'p13',
                question: '13. Cuando compras alimentos, bebidas, cosméticos, productos de salud u otros productos sensibles, ¿qué verificas? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Fecha de vencimiento', 'Procedencia', 'Marca',
                    'Estado del envase', 'Registro/certificación cuando corresponde',
                    'Recomendaciones o reputación del vendedor',
                    'Condiciones de almacenamiento', 'No suelo verificar', 'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p14',
                question: '14. ¿Alguna vez has comprado algo pagando una parte primero y el resto después?',
                type: 'radio',
                options: opts(['Sí', 'No']),
                condition: () => true
            });

            steps.push({
                id: 'p14_si_como',
                question: '¿Cómo fue? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Fiado', 'Cuotas', 'Adelanto + saldo', 'Letras',
                    'Crédito de tienda', 'Otro'
                ]),
                allowOther: true,
                condition: () => answers.p14 === 'Sí'
            });

            steps.push({
                id: 'p14_si_exp',
                question: '¿Qué fue lo bueno o malo de esa experiencia? (respuesta abierta)',
                type: 'textarea',
                placeholder: 'Cuéntanos...',
                condition: () => answers.p14 === 'Sí'
            });

            steps.push({
                id: 'p15',
                question: '15. ¿Alguna vez te has juntado con otras personas para comprar algo a un mejor precio?',
                type: 'radio',
                options: opts(['Sí', 'No']),
                condition: () => true
            });

            steps.push({
                id: 'p15_si',
                question: '¿Qué compraron y aproximadamente cuántas personas participaron? (respuesta abierta)',
                type: 'textarea',
                placeholder: 'Ej. compramos ropa, 5 personas...',
                condition: () => answers.p15 === 'Sí'
            });

            // --- BLOQUE E: DESCUBRIMIENTO DEL JOB (16-17) ---
            steps.push({
                id: 'p16',
                question: '16. Pensando en tus compras actuales, ¿qué es lo que más te cuesta o te incomoda? (selecciona hasta 3)',
                type: 'checkbox',
                options: opts([
                    'Encontrar buenos precios', 'Saber si realmente estoy obteniendo una oferta',
                    'Encontrar vendedores confiables', 'Saber si el producto es auténtico',
                    'Saber si está en buen estado', 'Saber si está vencido',
                    'Comparar alternativas', 'Conseguir crédito/cuotas/fiado',
                    'Recibir o recoger el producto', 'Encontrar buenos servicios',
                    'Comprar en pequeñas cantidades', 'Comprar por volumen', 'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p17',
                question: '17. ¿Qué producto o servicio te gustaría conseguir más barato, con mayor confianza o de una manera más fácil de lo que actualmente lo consigues? (respuesta abierta)',
                type: 'textarea',
                placeholder: 'Cuéntanos qué necesitas...',
                condition: () => true
            });

            // --- BLOQUE F: RESILIENCIA Y CONTEXTO (18-19) ---
            steps.push({
                id: 'p18',
                question: '18. Seguridad e inseguridad: En tu actividad de compra, venta, trabajo o negocio, ¿la inseguridad, robos, amenazas o extorsiones han cambiado la manera en que compras, vendes, cobras, entregas o recibes productos/servicios?',
                type: 'radio',
                options: opts(['Sí, mucho', 'Sí, algo', 'No', 'No aplica', 'Prefiero no responder']),
                condition: () => true
            });

            steps.push({
                id: 'p18_si',
                question: '¿Qué ha cambiado principalmente? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Evito determinados lugares u horarios', 'Prefiero lugares seguros para entregar/recoger',
                    'Evito publicar determinada información', 'Cambié mi forma de pago',
                    'Dejé de realizar determinadas actividades', 'Aumentaron mis costos',
                    'Otro'
                ]),
                allowOther: true,
                condition: () => (answers.p18 === 'Sí, mucho' || answers.p18 === 'Sí, algo')
            });

            steps.push({
                id: 'p19',
                question: '19. Fenómenos climáticos y otras interrupciones: En los últimos años, ¿algún fenómeno climático —lluvias, inundaciones, huaicos, oleajes, calor extremo u otro— ha afectado tus compras, ventas, transporte, abastecimiento o ingresos?',
                type: 'radio',
                options: opts(['Sí, mucho', 'Sí, algo', 'No', 'No recuerdo', 'No aplica']),
                condition: () => true
            });

            steps.push({
                id: 'p19_si',
                question: '¿Qué fue lo más afectado? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Transporte/entrega', 'Abastecimiento', 'Disponibilidad de productos',
                    'Precios', 'Local/infraestructura', 'Trabajo/ingresos',
                    'Compras de los clientes', 'Otro'
                ]),
                allowOther: true,
                condition: () => (answers.p19 === 'Sí, mucho' || answers.p19 === 'Sí, algo')
            });

            // --- BLOQUE G: LOCALIZACIÓN Y MOVILIDAD (20-23) ---
            // P20 actualizada con nueva estructura geográfica
            steps.push({
                id: 'p20',
                question: '20. ¿En qué localidad o zona realizas principalmente tus compras?',
                type: 'radio',
                options: opts([
                    'Lima Metropolitana / Callao',
                    'Arequipa',
                    'Trujillo',
                    'Piura',
                    'Chiclayo',
                    'Cusco',
                    'Ica',
                    'Huaraz',
                    // Núcleo Chimbote
                    'Chimbote',
                    'Nuevo Chimbote',
                    'Coishco',
                    'Santa',
                    'Nepeña',
                    'Moro',
                    'Casma',
                    'Huarmey',
                    'Chao',
                    'Virú',
                    // Expansión
                    'Otra ciudad/localidad de Áncash',
                    'Otra ciudad/localidad de la costa peruana',
                    'Otra ciudad/localidad de la sierra peruana',
                    'Otra ciudad/localidad de la selva peruana',
                    'Principalmente compro por Internet, sin una localidad específica',
                    'Otra:' // esta opción tendrá campo de texto
                ]),
                allowOther: true, // para que "Otra:" muestre campo de texto
                condition: () => true
            });

            // P21 actualizada con nueva estructura geográfica
            steps.push({
                id: 'p21',
                question: '21. ¿En qué localidad o zona realizas principalmente tu actividad comercial o de trabajo?',
                type: 'radio',
                options: opts([
                    'Lima Metropolitana / Callao',
                    'Arequipa',
                    'Trujillo',
                    'Piura',
                    'Chiclayo',
                    'Cusco',
                    'Ica',
                    'Huaraz',
                    // Núcleo Chimbote
                    'Chimbote',
                    'Nuevo Chimbote',
                    'Coishco',
                    'Santa',
                    'Nepeña',
                    'Moro',
                    'Casma',
                    'Huarmey',
                    'Chao',
                    'Virú',
                    // Expansión
                    'Otra ciudad/localidad de Áncash',
                    'Otra ciudad/localidad de la costa peruana',
                    'Otra ciudad/localidad de la sierra peruana',
                    'Otra ciudad/localidad de la selva peruana',
                    'Principalmente trabajo/comercializo por Internet, sin una localidad específica',
                    'Otra:'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p22',
                question: '22. ¿Cómo prefieres recibir o completar una compra?',
                type: 'radio',
                options: opts([
                    'Entrega a domicilio', 'Recoger en el negocio',
                    'Recoger en un punto acordado', 'Encontrarme con el vendedor',
                    'Depende del producto', 'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p23',
                question: '23. ¿Hasta qué distancia estarías dispuesto a desplazarte para conseguir una buena oferta?',
                type: 'radio',
                options: opts([
                    'Menos de 1 km (10 cuadras)', '1–3 km', '3–5 km', '5–10 km',
                    'Más de 10 km', 'Depende del producto o del ahorro'
                ]),
                condition: () => true
            });

            // --- BLOQUE H: PARTICIPACIÓN FUTURA (24-26) ---
            steps.push({
                id: 'p24',
                question: '24. ¿Te gustaría participar en futuras pruebas de nuevas formas de comprar productos, servicios u ofertas?',
                type: 'radio',
                options: opts(['Sí', 'Tal vez', 'No']),
                condition: () => true
            });

            steps.push({
                id: 'p25',
                question: '25. ¿Qué te interesaría probar? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Encontrar productos en oferta/remate', 'Comprar directamente a vendedores',
                    'Comprar por volumen', 'Compra grupal', 'Servicios',
                    'Comparar precios', 'Ofertas de negocios locales',
                    'Entrega/recojo', 'Otro'
                ]),
                allowOther: true,
                condition: () => (answers.p24 === 'Sí' || answers.p24 === 'Tal vez')
            });

            steps.push({
                id: 'p26',
                question: '26. Si deseas participar, déjanos un medio de contacto (WhatsApp o Email) – opcional:',
                type: 'text',
                placeholder: 'Ej. 987654321 o correo@ejemplo.com',
                condition: () => (answers.p24 === 'Sí' || answers.p24 === 'Tal vez')
            });

            // ------------------------------------------------------------
            // 2. FUNCIONES AUXILIARES (geolocalización, metadatos, envío)
            // ------------------------------------------------------------

            // Detectar dispositivo
            function detectarDispositivo() {
                const ua = navigator.userAgent;
                if (/tablet|ipad|playbook|silk/i.test(ua)) return 'tablet';
                if (/mobile|iphone|ipod|android|blackberry|windows phone/i.test(ua)) return 'celular';
                return 'laptop/PC';
            }

            // Obtener fuente (canal) desde URL params o referrer
            function obtenerFuente() {
                const params = new URLSearchParams(window.location.search);
                const utmSource = params.get('utm_source');
                if (utmSource) return utmSource;

                try {
                    const ref = document.referrer || '';
                    if (ref.includes('facebook.com')) return 'Facebook';
                    if (ref.includes('messenger.com')) return 'Messenger';
                    if (ref.includes('whatsapp.com')) return 'WhatsApp';
                    if (ref.includes('instagram.com')) return 'Instagram';
                    if (ref.includes('tiktok.com')) return 'TikTok';
                    if (ref.includes('youtube.com')) return 'YouTube';
                    if (ref.includes('google.com')) return 'Google';
                    if (ref.includes('twitter.com')) return 'Twitter';
                    if (ref.includes('linkedin.com')) return 'LinkedIn';
                    if (ref.includes('megaremates.com')) return 'Web directa';
                    return 'directo';
                } catch (e) {
                    return 'desconocida';
                }
            }

            // Obtener IP y ubicación aproximada desde ipapi.co
            function obtenerGeoData() {
                return fetch('https://ipapi.co/json/')
                    .then(res => {
                        if (!res.ok) throw new Error('Error al obtener geolocalización');
                        return res.json();
                    })
                    .then(data => {
                        return {
                            ip: data.ip || 'desconocida',
                            ciudad: data.city || '',
                            region: data.region || '',
                            pais: data.country_name || '',
                            lat: data.latitude || null,
                            lon: data.longitude || null
                        };
                    })
                    .catch(err => {
                        console.warn('No se pudo obtener geolocalización:', err);
                        return null;
                    });
            }

            // Obtener datos de conexión
            function obtenerConexion() {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn) {
                    return {
                        effectiveType: conn.effectiveType || 'unknown',
                        downlink: conn.downlink || null,
                        rtt: conn.rtt || null
                    };
                }
                return {};
            }

            // ------------------------------------------------------------
            // 3. ENVÍO A TRAVÉS DEL PROXY DE VERCEL (SEGURO)
            // ------------------------------------------------------------
            function enviarRespuestas(geo) {
                // Construir objeto con todas las respuestas
                const dataToSend = {};
                for (const key in answers) {
                    if (answers[key] !== undefined && answers[key] !== null && answers[key] !== '') {
                        dataToSend[key] = answers[key];
                    }
                }

                // Calcular tiempo total
                const finEncuesta = new Date();
                const tiempoTotalSeg = Math.round((finEncuesta - inicioEncuesta) / 1000);

                // Construir metadatos
                const metadata = {
                    fuente: fuente,
                    dispositivo: dispositivo,
                    inicio: inicioEncuesta.toISOString(),
                    fin: finEncuesta.toISOString(),
                    tiempo_total_segundos: tiempoTotalSeg,
                    tiempos_por_pregunta: tiemposPorPregunta,
                    conexion: conexion,
                    navegador: navigator.userAgent,
                    plataforma: navigator.platform || 'desconocida'
                };

                dataToSend._metadata = metadata;
                if (geo) {
                    dataToSend._geo = geo;
                }

                // Enviar al proxy de Vercel (sin exponer claves)
                return fetch('/api/encuesta', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        datos: dataToSend,
                        token: NONCE
                    })
                })
                .then(async res => {
                    if (!res.ok) {
                        const errorText = await res.text();
                        let errorMsg;
                        try {
                            const errorJson = JSON.parse(errorText);
                            errorMsg = errorJson.error || `Error ${res.status}`;
                        } catch (e) {
                            errorMsg = `Error ${res.status}: ${errorText || res.statusText}`;
                        }
                        throw new Error(errorMsg);
                    }
                    // Intentar parsear JSON (puede ser vacío)
                    const text = await res.text();
                    if (!text) return {};
                    try {
                        return JSON.parse(text);
                    } catch (e) {
                        return { success: true, raw: text };
                    }
                })
                .then(data => {
                    datosEnviados = true;
                    try {
                        localStorage.setItem(STORAGE_KEY, 'true');
                    } catch (e) { /* ignore */ }
                    return { success: true, data };
                })
                .catch(error => {
                    console.error('❌ Error al enviar:', error);
                    return { success: false, error: error.message };
                });
            }

            // ------------------------------------------------------------
            // 4. LÓGICA DE NAVEGACIÓN Y RENDERIZADO (con ajuste para "Otra:")
            // ------------------------------------------------------------
            let currentStepIndex = 0;

            function getVisibleSteps() {
                return steps.filter(step => step.condition());
            }

            function getCurrentVisibleIndex() {
                const visible = getVisibleSteps();
                if (currentStepIndex >= visible.length) {
                    currentStepIndex = visible.length - 1;
                }
                if (currentStepIndex < 0) currentStepIndex = 0;
                return currentStepIndex;
            }

            function getCurrentStep() {
                const visible = getVisibleSteps();
                const idx = getCurrentVisibleIndex();
                return visible[idx] || null;
            }

            function saveCurrentAnswer() {
                const step = getCurrentStep();
                if (!step) return;
                const el = document.querySelector(`[data-step-id="${step.id}"]`);
                if (!el) return;
                let value;
                if (step.type === 'radio') {
                    const checked = el.querySelector('input[type="radio"]:checked');
                    if (checked) {
                        value = checked.value;
                        // Si es "Otra:", tomar el texto del input asociado
                        if (value === 'Otra:') {
                            const label = checked.closest('label');
                            if (label) {
                                const textInput = label.querySelector('.otro-input');
                                if (textInput && textInput.value.trim() !== '') {
                                    value = 'Otra: ' + textInput.value.trim();
                                }
                            }
                        }
                    } else {
                        value = null;
                    }
                } else if (step.type === 'checkbox') {
                    const checkboxes = el.querySelectorAll('input[type="checkbox"]:checked');
                    value = Array.from(checkboxes).map(cb => cb.value);
                    const otroInput = el.querySelector('.otro-input');
                    if (otroInput && otroInput.value.trim() !== '') {
                        const otroCheck = el.querySelector('input[type="checkbox"][value="Otro"]');
                        if (otroCheck && otroCheck.checked) {
                            value = value.filter(v => v !== 'Otro' && v !== 'Otros' && v !== 'Otra localidad' && v !== 'Otros');
                            value.push(otroInput.value.trim());
                        }
                        // También manejar "Otra:" en checkbox (por si acaso)
                        const otraCheck = el.querySelector('input[type="checkbox"][value="Otra:"]');
                        if (otraCheck && otraCheck.checked) {
                            value = value.filter(v => v !== 'Otra:');
                            value.push('Otra: ' + otroInput.value.trim());
                        }
                    }
                } else if (step.type === 'text' || step.type === 'textarea') {
                    const input = el.querySelector('input, textarea');
                    value = input ? input.value : '';
                }
                if (value !== undefined) {
                    answers[step.id] = value;
                }
            }

            function loadAnswer(step) {
                const el = document.querySelector(`[data-step-id="${step.id}"]`);
                if (!el) return;
                const val = answers[step.id];
                if (val === undefined) return;
                if (step.type === 'radio') {
                    const radios = el.querySelectorAll('input[type="radio"]');
                    let found = false;
                    radios.forEach(r => {
                        if (r.value === val) {
                            r.checked = true;
                            found = true;
                        }
                        // Si el valor guardado es "Otra: ..." y no coincide con ninguna opción
                        if (!found && val && typeof val === 'string' && val.startsWith('Otra:')) {
                            if (r.value === 'Otra:') {
                                r.checked = true;
                                const label = r.closest('label');
                                if (label) {
                                    const textInput = label.querySelector('.otro-input');
                                    if (textInput) {
                                        textInput.value = val.replace('Otra: ', '').trim();
                                    }
                                }
                                found = true;
                            }
                        }
                    });
                } else if (step.type === 'checkbox') {
                    const checks = el.querySelectorAll('input[type="checkbox"]');
                    checks.forEach(cb => {
                        if (Array.isArray(val)) {
                            cb.checked = val.some(v => v === cb.value || v.startsWith(cb.value + ':'));
                        }
                    });
                    const otroInput = el.querySelector('.otro-input');
                    if (otroInput && Array.isArray(val)) {
                        const otroVal = val.find(v => !v.startsWith('Otro') && !v.startsWith('Otros') && !v.startsWith('Otra') && !v.startsWith('No aplica') && !v.startsWith('Prefiero') && !v.startsWith('Depende') && !v.startsWith('Más de') && !v.startsWith('Menos de'));
                        if (otroVal && !step.options.some(o => o.value === otroVal)) {
                            otroInput.value = otroVal;
                        }
                    }
                } else if (step.type === 'text' || step.type === 'textarea') {
                    const input = el.querySelector('input, textarea');
                    if (input) input.value = val;
                }
            }

            function registrarTiempoPregunta(stepId) {
                if (preguntaActualId && inicioPregunta) {
                    const duracion = Math.round((new Date() - inicioPregunta) / 1000);
                    tiemposPorPregunta[preguntaActualId] = duracion;
                }
                preguntaActualId = stepId;
                inicioPregunta = new Date();
            }

            function renderStep() {
                const step = getCurrentStep();
                const area = document.getElementById('dynamicArea');
                if (!step) {
                    showSummary();
                    return;
                }

                if (step.id !== preguntaActualId) {
                    registrarTiempoPregunta(step.id);
                }

                const visible = getVisibleSteps();
                const idx = getCurrentVisibleIndex();
                document.getElementById('stepCounter').textContent = `Paso ${idx+1} de ${visible.length}`;
                const progress = ((idx) / (visible.length - 1)) * 100;
                document.getElementById('progressFill').style.width = (visible.length === 1 ? 100 : progress) + '%';

                let html = `<div class="question-area" data-step-id="${step.id}">`;
                html += `<div class="question-text">${step.question}`;
                if (step.type === 'text' || step.type === 'textarea') {
                    html += ` <span class="sub-label">(respuesta corta)</span>`;
                }
                html += `</div>`;

                if (step.type === 'radio' || step.type === 'checkbox') {
                    html += `<div class="options-group">`;
                    const inputType = step.type;
                    const name = step.id;
                    step.options.forEach(opt => {
                        const value = opt.value;
                        html += `<label>`;
                        html += `<input type="${inputType}" name="${name}" value="${value}">`;
                        html += `<span>${opt.label}</span>`;
                        // Mostrar campo de texto para "Otro", "Otros", "Otra localidad" o "Otra:"
                        if ((opt.label === 'Otro' || opt.label === 'Otros' || opt.label === 'Otra localidad' || opt.label === 'Otra:') && step.allowOther) {
                            html += `<input type="text" class="otro-input" placeholder="Especifica..." style="margin-left:8px;">`;
                        }
                        html += `</label>`;
                    });
                    html += `</div>`;
                } else if (step.type === 'text') {
                    html += `<input type="text" class="text-input" placeholder="${step.placeholder || ''}" style="min-height:50px;">`;
                } else if (step.type === 'textarea') {
                    html += `<textarea class="text-input textarea" placeholder="${step.placeholder || ''}"></textarea>`;
                }

                html += `<div class="navigation">`;
                html += `<button class="btn btn-secondary" id="prevBtn" ${idx===0?'disabled':''}>← Anterior</button>`;
                if (idx === visible.length - 1) {
                    html += `<button class="btn btn-success" id="nextBtn">Enviar respuestas ✓</button>`;
                } else {
                    html += `<button class="btn btn-primary" id="nextBtn">Siguiente →</button>`;
                }
                html += `</div>`;
                html += `</div>`;
                area.innerHTML = html;

                loadAnswer(step);

                const nextBtn = document.getElementById('nextBtn');
                const prevBtn = document.getElementById('prevBtn');

                const inputs = area.querySelectorAll('input, textarea');
                inputs.forEach(inp => {
                    inp.addEventListener('change', () => {
                        saveCurrentAnswer();
                        if (step.type === 'radio') {
                            const conditionalParents = ['p10', 'p12', 'p14', 'p15', 'p18', 'p19', 'p24'];
                            if (conditionalParents.includes(step.id)) {
                                const visibleNow = getVisibleSteps();
                                const currentId = step.id;
                                const newIdx = visibleNow.findIndex(s => s.id === currentId);
                                if (newIdx !== -1) {
                                    currentStepIndex = newIdx;
                                }
                                renderStep();
                            }
                        }
                    });
                    if (inp.tagName === 'INPUT' || inp.tagName === 'TEXTAREA') {
                        inp.addEventListener('blur', saveCurrentAnswer);
                    }
                });

                nextBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    saveCurrentAnswer();
                    const stepNow = getCurrentStep();
                    if (!stepNow) return;

                    if (stepNow.type === 'radio') {
                        const val = answers[stepNow.id];
                        if (!val) {
                            alert('Por favor selecciona una opción.');
                            return;
                        }
                    } else if (stepNow.type === 'checkbox') {
                        const val = answers[stepNow.id];
                        if (!val || (Array.isArray(val) && val.length === 0)) {
                            alert('Selecciona al menos una opción.');
                            return;
                        }
                    } else if (stepNow.type === 'text' || stepNow.type === 'textarea') {
                        const val = answers[stepNow.id];
                        if (!val || val.trim() === '') {
                            alert('Por favor escribe tu respuesta.');
                            return;
                        }
                    }

                    const visibleNow = getVisibleSteps();
                    if (currentStepIndex === visibleNow.length - 1) {
                        nextBtn.disabled = true;
                        nextBtn.textContent = 'Enviando...';
                        registrarTiempoPregunta(stepNow.id);

                        if (!geoData) {
                            obtenerGeoData().then(geo => {
                                geoData = geo;
                                enviarRespuestas(geo).then(result => {
                                    showSummary(result);
                                });
                            }).catch(() => {
                                enviarRespuestas(null).then(result => {
                                    showSummary(result);
                                });
                            });
                        } else {
                            enviarRespuestas(geoData).then(result => {
                                showSummary(result);
                            });
                        }
                        return;
                    }

                    registrarTiempoPregunta(stepNow.id);
                    const nextIdx = currentStepIndex + 1;
                    if (nextIdx < visibleNow.length) {
                        currentStepIndex = nextIdx;
                        renderStep();
                    }
                });

                prevBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (currentStepIndex > 0) {
                        const stepNow = getCurrentStep();
                        if (stepNow) registrarTiempoPregunta(stepNow.id);
                        currentStepIndex--;
                        renderStep();
                    }
                });
            }

            // ------------------------------------------------------------
            // 5. RESUMEN FINAL (sin cambios)
            // ------------------------------------------------------------
            function showSummary(envioResult) {
                const area = document.getElementById('dynamicArea');
                saveCurrentAnswer();

                const allAnswers = { ...answers };
                const visibleSteps = getVisibleSteps();

                let html = `<div class="summary">`;

                if (envioResult) {
                    if (envioResult.success) {
                        html += `<div class="alert alert-success">✅ ¡Encuesta enviada correctamente! Muchas gracias por tu tiempo.</div>`;
                    } else {
                        html += `<div class="alert alert-error">❌ Error al enviar los datos: ${envioResult.error || 'intenta de nuevo más tarde'}.<br> Tus respuestas se han guardado localmente, pero no se enviaron al servidor.</div>`;
                    }
                } else {
                    if (!datosEnviados) {
                        html += `<div class="alert alert-info">⚠️ Aún no has enviado los datos. Puedes volver atrás y hacer clic en "Enviar respuestas".</div>`;
                    } else {
                        html += `<div class="alert alert-success">✅ Encuesta completada y enviada correctamente.</div>`;
                    }
                }

                html += `<h3 style="margin-bottom:16px; font-weight:600; color:#0b1a2a;">Resumen de tus respuestas</h3>`;

                visibleSteps.forEach(step => {
                    const val = allAnswers[step.id];
                    if (val === undefined || val === null || (Array.isArray(val) && val.length === 0) || (typeof val ===
                            'string' && val.trim() === '')) {
                        return;
                    }
                    html += `<div class="summary-item">`;
                    html += `<strong>${step.question}</strong>`;
                    if (Array.isArray(val)) {
                        html += `<div class="answer multi">`;
                        val.forEach(v => {
                            html += `<span>${v}</span>`;
                        });
                        html += `</div>`;
                    } else {
                        html += `<div class="answer">${val}</div>`;
                    }
                    html += `</div>`;
                });

                html += `<div style="margin-top:24px; display:flex; gap:12px;">`;
                html += `<button class="btn btn-secondary" id="backBtn">← Volver</button>`;
                html += `<button class="btn btn-primary" id="restartBtn" style="flex:1;">🔁 Nueva encuesta</button>`;
                html += `</div>`;
                html += `</div>`;
                area.innerHTML = html;

                document.getElementById('progressFill').style.width = '100%';
                document.getElementById('stepCounter').textContent = '¡Completado!';

                document.getElementById('backBtn').addEventListener('click', function() {
                    const visible = getVisibleSteps();
                    if (visible.length > 0) {
                        currentStepIndex = visible.length - 1;
                        renderStep();
                    }
                });

                document.getElementById('restartBtn').addEventListener('click', function() {
                    for (let key in answers) {
                        delete answers[key];
                    }
                    datosEnviados = false;
                    currentStepIndex = 0;
                    try {
                        localStorage.removeItem(STORAGE_KEY);
                    } catch (e) { /* ignore */ }
                    renderStep();
                });
            }

            // ------------------------------------------------------------
            // 6. INICIO
            // ------------------------------------------------------------
            function init() {
                // Verificar duplicado
                try {
                    const yaEnviado = localStorage.getItem(STORAGE_KEY);
                    if (yaEnviado === 'true') {
                        const area = document.getElementById('dynamicArea');
                        area.innerHTML = `
                            <div class="alert alert-info" style="margin-top:40px; text-align:center; font-size:18px;">
                                <p>✅ Ya has completado esta encuesta anteriormente.</p>
                                <p style="margin-top:12px; font-size:16px; color:#5b6f82;">Gracias por tu participación.</p>
                            </div>
                        `;
                        document.getElementById('stepCounter').textContent = 'Completado';
                        document.getElementById('progressFill').style.width = '100%';
                        return;
                    }
                } catch (e) { /* ignorar */ }

                fuente = obtenerFuente();
                dispositivo = detectarDispositivo();
                conexion = obtenerConexion();

                obtenerGeoData().then(geo => {
                    geoData = geo;
                }).catch(() => {
                    geoData = null;
                });

                preguntaActualId = null;
                inicioPregunta = new Date();

                currentStepIndex = 0;
                datosEnviados = false;
                renderStep();
            }

            window.addEventListener('load', init);

        })();
    </script>
</body>
</html>
