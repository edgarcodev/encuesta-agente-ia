<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa de Investigación Comercial</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: #f4f7fc; min-height: 100vh; display: flex;
            align-items: center; justify-content: center; padding: 16px;
        }
        .survey-container {
            max-width: 720px; width: 100%; background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.08), 0 8px 24px rgba(0,0,0,0.04);
            padding: 32px 28px;
        }
        .survey-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 20px;
        }
        .survey-header h1 {
            font-size: 20px; font-weight: 700; color: #1a2634;
        }
        .survey-header .step-counter {
            font-size: 14px; font-weight: 500; color: #5b6f82;
            background: #eef2f7; padding: 4px 14px; border-radius: 40px;
        }
        .progress-bar-container {
            width: 100%; height: 6px; background: #e6ecf3;
            border-radius: 10px; margin-bottom: 28px; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; background: linear-gradient(90deg, #f97316, #f59e0b);
            border-radius: 10px; transition: width 0.35s ease; width: 0%;
        }
        .question-area {
            min-height: 240px; display: flex; flex-direction: column;
            justify-content: space-between;
        }
        .question-text {
            font-size: 20px; font-weight: 600; color: #0b1a2a;
            line-height: 1.4; margin-bottom: 20px;
        }
        .question-text .sub-label {
            font-weight: 400; font-size: 14px; color: #5b6f82;
            display: block; margin-top: 4px;
        }
        .options-group {
            display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px;
        }
        .options-group label {
            display: flex; align-items: center; gap: 12px;
            font-size: 16px; color: #1e2a36; padding: 10px 14px;
            background: #f8faff; border: 1.5px solid #e2e8f0;
            border-radius: 14px; cursor: pointer; transition: all 0.15s;
            flex-wrap: wrap;
        }
        .options-group label:hover {
            background: #f0f4fe; border-color: #cbd5e1;
        }
        .options-group input[type="radio"],
        .options-group input[type="checkbox"] {
            width: 18px; height: 18px; accent-color: #f97316;
            flex-shrink: 0; cursor: pointer;
        }
        .text-input {
            width: 100%; padding: 14px 16px; font-size: 16px;
            border: 1.5px solid #e2e8f0; border-radius: 14px;
            background: #fafcff; font-family: inherit; resize: vertical;
        }
        .text-input:focus {
            outline: none; border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249,115,22,0.12);
        }
        .text-input.textarea { min-height: 90px; }
        .otro-input {
            flex: 1; min-width: 120px; padding: 6px 12px;
            border: 1.5px solid #dce2ec; border-radius: 40px;
            font-size: 14px; background: white;
        }
        .otro-input:focus {
            border-color: #f97316; outline: none;
            box-shadow: 0 0 0 3px rgba(249,115,22,0.12);
        }
        .navigation {
            display: flex; justify-content: space-between; gap: 12px;
            margin-top: 28px; padding-top: 20px;
            border-top: 1px solid #e9eef4;
        }
        .btn {
            padding: 12px 28px; border: none; border-radius: 40px;
            font-weight: 600; font-size: 16px; cursor: pointer;
            transition: all 0.2s; background: #f1f4f9; color: #1e2a36;
            flex: 1; text-align: center;
        }
        .btn-primary {
            background: #f97316; color: white;
            box-shadow: 0 4px 12px rgba(249,115,22,0.25);
        }
        .btn-primary:hover { background: #ea5a0a; transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary { background: #eef2f7; }
        .btn-secondary:hover { background: #e2e8f0; }
        .btn-secondary:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-success {
            background: #22a65e; color: white;
            box-shadow: 0 4px 12px rgba(34,166,94,0.25);
        }
        .btn-success:hover { background: #1a8a4e; transform: translateY(-2px); }
        .btn-success:disabled { opacity: 0.5; cursor: not-allowed; }
        .summary { padding: 8px 0; }
        .summary-item { padding: 14px 0; border-bottom: 1px solid #eef2f7; }
        .summary-item:last-child { border-bottom: none; }
        .summary-item strong { display: block; font-weight: 600; color: #1a2634; margin-bottom: 4px; }
        .summary-item .answer {
            color: #2d3f52; background: #f5f8fe;
            padding: 6px 14px; border-radius: 40px;
            display: inline-block; font-size: 14px;
        }
        .summary-item .answer.multi { display: flex; flex-wrap: wrap; gap: 6px; }
        .summary-item .answer.multi span { background: #f5f8fe; padding: 4px 14px; border-radius: 40px; }
        .alert {
            border-radius: 16px; padding: 16px 20px;
            margin-bottom: 16px; font-weight: 500;
        }
        .alert-success { background: #e6f7e6; color: #0e5e2e; }
        .alert-error { background: #fde8e8; color: #a12b2b; }
        .alert-info { background: #fef3e8; color: #8a4a0a; }
        .info-hint {
            font-size: 14px; color: #5b6f82; background: #f1f5fa;
            padding: 10px 14px; border-radius: 12px; margin-bottom: 14px;
            border-left: 3px solid #f97316;
        }
        @media (max-width: 480px) {
            .survey-container { padding: 20px 16px; }
            .question-text { font-size: 18px; }
            .btn { padding: 12px 18px; font-size: 15px; }
            .options-group label { padding: 10px 12px; font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="survey-container" id="app">
        <div class="survey-header">
            <h1>📦 Investigación Comercial</h1>
            <span class="step-counter" id="stepCounter">Paso 1</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div id="dynamicArea"></div>
    </div>

    <script>
        (function() {
            'use strict';

            const NONCE = (() => {
                let n = sessionStorage.getItem('encuesta_nonce');
                if (!n) {
                    n = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                    sessionStorage.setItem('encuesta_nonce', n);
                }
                return n;
            })();

            const STORAGE_KEY = 'megaremates_encuesta_enviada';

            let datosEnviados = false;
            let geoData = null;
            const inicioEncuesta = new Date();
            const tiemposPorPregunta = {};
            let preguntaActualId = null;
            let inicioPregunta = null;
            let fuente = 'desconocida';
            let dispositivo = 'desktop';
            let conexion = {};

            const steps = [];
            function opts(arr) { return arr.map(label => ({ label, value: label })); }
            const answers = {};

            // ============================================================
            // BLOQUE 1
            // ============================================================
            steps.push({
                id: 'p1',
                question: '1. ¿Qué compras habitualmente? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Alimentos y bebidas', 'Ropa, calzado y accesorios',
                    'Productos para el hogar', 'Muebles',
                    'Tecnología y electrónica', 'Belleza y cuidado personal',
                    'Productos de salud', 'Productos para niños',
                    'Construcción y ferretería', 'Herramientas y maquinaria',
                    'Productos para vehículos', 'Productos agrícolas/agropecuarios',
                    'Productos para mascotas', 'Productos para empresas',
                    'Servicios profesionales', 'Educación/capacitación',
                    'Transporte/logística', 'Entretenimiento/eventos',
                    'Productos digitales', 'Otros'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p2',
                question: '2. ¿Con qué frecuencia realizas compras?',
                type: 'radio',
                options: opts([
                    'Varias veces por semana', 'Aproximadamente una vez por semana',
                    'Varias veces al mes', 'Aproximadamente una vez al mes',
                    'Cada pocos meses', 'Principalmente cuando surge una necesidad',
                    'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p3',
                question: '3. ¿Dónde realizas normalmente tus compras? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Tiendas físicas', 'Mercados', 'Ferias', 'Centros comerciales',
                    'Comercios de barrio', 'Venta directa',
                    'Facebook', 'Facebook Marketplace', 'WhatsApp',
                    'Instagram', 'TikTok', 'Página web',
                    'Marketplace/plataforma especializada', 'Aplicaciones móviles',
                    'Recomendaciones de conocidos', 'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            // ============================================================
            // BLOQUE 2
            // ============================================================
            steps.push({
                id: 'p4',
                question: '4. Cuando necesitas comprar algo, ¿cómo lo buscas normalmente? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Pregunto a familiares/amigos/conocidos', 'Busco en Google',
                    'Busco en Facebook', 'Busco en Marketplace',
                    'Busco en Instagram', 'Busco en TikTok',
                    'Busco en WhatsApp', 'Busco en una tienda o marketplace específico',
                    'Voy directamente a una tienda física',
                    'Pregunto a vendedores', 'Comparo en varios lugares', 'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p5',
                question: '5. ¿Qué haces normalmente antes de decidir una compra? (hasta 4)',
                type: 'checkbox',
                maxSelections: 4,
                options: opts([
                    'Comparo precios', 'Comparo productos',
                    'Leo opiniones/comentarios', 'Pregunto a otras personas',
                    'Pregunto directamente al vendedor', 'Reviso fotografías/videos',
                    'Reviso características', 'Compruebo la reputación del vendedor',
                    'Busco promociones', 'Espero una oferta',
                    'Visito físicamente el lugar', 'Comparo opciones por Internet',
                    'Compro directamente sin comparar mucho', 'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p6',
                question: '6. Piensa en tu última compra importante. ¿Cómo encontraste finalmente lo que compraste? (respuesta abierta)',
                type: 'textarea',
                placeholder: 'Cuéntanos brevemente qué necesitabas, dónde buscaste y cómo elegiste...',
                condition: () => true
            });

            // ============================================================
            // BLOQUE 3
            // ============================================================
            steps.push({
                id: 'p7',
                question: '7. ¿Qué importancia tiene el precio cuando decides una compra?',
                type: 'radio',
                options: opts([
                    'Es el factor principal',
                    'Es muy importante, pero no es el único',
                    'Tiene importancia moderada',
                    'Tiene poca importancia',
                    'Depende del producto o servicio'
                ]),
                condition: () => true
            });

            steps.push({
                id: 'p8',
                question: '8. Cuando encuentras una oferta, descuento, liquidación, lote o precio especialmente bajo, ¿qué haces normalmente? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Compro inmediatamente si lo necesito',
                    'Comparo antes con otras opciones',
                    'Pregunto si el precio realmente es bueno',
                    'Compro más cantidad de la que pensaba',
                    'Compro para aprovechar y guardar',
                    'Compro para compartir con otras personas',
                    'Compro para revender',
                    'No suelo cambiar mi decisión por una oferta',
                    'Depende del producto',
                    'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p9',
                question: '9. ¿Has comprado alguna vez productos en liquidación, remate, lote, saldo, excedente o por cierre de negocio?',
                type: 'radio',
                options: opts([
                    'Sí, frecuentemente', 'Sí, algunas veces', 'Sí, una vez',
                    'No', 'No estoy seguro/a de cómo se clasificaba la compra'
                ]),
                condition: () => true
            });

            steps.push({
                id: 'p9_motivo',
                question: '¿Qué te motivó principalmente a comprar de esa manera? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Precio', 'Cantidad', 'Oportunidad',
                    'Producto difícil de encontrar', 'Para uso personal',
                    'Para mi negocio', 'Para revender', 'Otro'
                ]),
                allowOther: true,
                condition: () => {
                    const v = answers.p9;
                    return v === 'Sí, frecuentemente' || v === 'Sí, algunas veces' || v === 'Sí, una vez';
                }
            });

            // ============================================================
            // BLOQUE 4
            // ============================================================
            steps.push({
                id: 'p10',
                question: '10. ¿Para quién o para qué realizas principalmente tus compras? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Para mí', 'Para mi hogar o familia',
                    'Para mis hijos u otras personas que dependen de mí',
                    'Para mi trabajo o actividad profesional', 'Para mi negocio',
                    'Para revender', 'Para producir o transformar otros productos',
                    'Para prestar un servicio',
                    'Para una institución, organización o empresa',
                    'Para otra persona', 'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            // ============================================================
            // BLOQUE 5
            // ============================================================
            steps.push({
                id: 'p11',
                question: '11. ¿Qué condiciones influyen actualmente en la forma en que realizas tus compras? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Necesito ahorrar lo máximo posible',
                    'Tengo un presupuesto limitado o variable',
                    'Tengo poco tiempo disponible',
                    'Necesito comprar desde casa o a distancia',
                    'Tengo responsabilidades de cuidado de hijos',
                    'Tengo responsabilidades de cuidado de otros familiares',
                    'Necesito comprar cerca de donde vivo o trabajo',
                    'Tengo dificultades para desplazarme',
                    'Prefiero comprar cuando puedo pagar en efectivo',
                    'Prefiero pagar digitalmente',
                    'Necesito comparar varias opciones antes de decidir',
                    'Necesito comprar rápidamente cuando surge una necesidad',
                    'Ninguna de estas condiciones influye significativamente',
                    'Otra'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p12',
                question: '12. ¿Qué necesitas saber o comprobar para confiar en un vendedor? (hasta 5)',
                type: 'checkbox',
                maxSelections: 5,
                options: opts([
                    'Identidad del vendedor', 'Ubicación', 'Teléfono/WhatsApp',
                    'Opiniones de otros compradores', 'Historial/reputación',
                    'Fotografías reales', 'Información detallada del producto',
                    'Precio claro', 'Condiciones de venta', 'Garantía',
                    'Posibilidad de devolución', 'Comprobante de compra',
                    'Poder verlo presencialmente', 'Pago seguro',
                    'Referencias de otras personas', 'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p13',
                question: '13. ¿Has tenido alguna experiencia problemática al comprar? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Producto diferente de lo ofrecido', 'Producto defectuoso',
                    'Producto falsificado o de dudosa procedencia',
                    'Pago que resultó ser fraudulento', 'Vendedor que desapareció',
                    'No recibí el producto', 'Entrega tardía',
                    'Problema con una devolución', 'Problema con garantía',
                    'Información engañosa', 'Cuenta/perfil falso',
                    'Otro problema', 'No he tenido problemas importantes'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p13_abierta',
                question: '¿Qué ocurrió y cómo lo resolviste? (opcional)',
                type: 'textarea',
                placeholder: 'Cuéntanos brevemente...',
                condition: () => {
                    const v = answers.p13;
                    if (!v || !Array.isArray(v)) return false;
                    return !v.includes('No he tenido problemas importantes');
                }
            });

            // ============================================================
            // BLOQUE 7
            // ============================================================
            steps.push({
                id: 'p14',
                question: '14. ¿Cómo pagas normalmente tus compras? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Efectivo', 'Tarjeta de débito', 'Tarjeta de crédito',
                    'Transferencia bancaria', 'Billetera digital',
                    'Aplicación de pagos', 'Pago contraentrega',
                    'Crédito/fiado', 'Pago en cuotas', 'Separación con adelanto',
                    'PayPal u otro servicio internacional',
                    'Otro medio de pago local', 'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p15',
                question: '15. ¿Qué es lo más importante para ti al momento de pagar? (hasta 3)',
                type: 'checkbox',
                maxSelections: 3,
                options: opts([
                    'Seguridad', 'Rapidez', 'Facilidad',
                    'Poder pagar en efectivo', 'Poder pagar digitalmente',
                    'No pagar comisiones elevadas', 'Poder pagar después',
                    'Poder pagar en cuotas', 'Tener comprobante',
                    'Poder reclamar si algo sale mal', 'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            // ============================================================
            // BLOQUE 8
            // ============================================================
            steps.push({
                id: 'p16',
                question: '16. ¿Cómo recibes normalmente tus compras? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Las recojo personalmente',
                    'Me las entregan en mi domicilio',
                    'Me las entregan en mi trabajo',
                    'Las recojo en una tienda/punto de entrega',
                    'Uso delivery', 'Uso courier',
                    'El vendedor las envía por transporte interprovincial',
                    'Las recibo por correo/servicio postal',
                    'Depende de la compra', 'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p17',
                question: '17. ¿Qué problemas has tenido con la entrega de tus compras? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Demora', 'Costo elevado', 'Producto dañado',
                    'Producto perdido', 'Dirección incorrecta',
                    'Problemas de coordinación',
                    'No encontrar un horario conveniente',
                    'Problemas de seguridad',
                    'No poder recibir personalmente',
                    'Ninguno importante', 'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            // ============================================================
            // BLOQUE 9
            // ============================================================
            steps.push({
                id: 'p18',
                question: '18. Cuando ocurre un imprevisto importante, ¿qué sucede normalmente con tus compras? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Las postergo', 'Busco otro proveedor/vendedor',
                    'Compro presencialmente', 'Compro por otro canal',
                    'Busco un producto sustituto', 'Compro en otra localidad',
                    'Cancelo la compra', 'Continúo normalmente', 'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            steps.push({
                id: 'p19',
                question: '19. ¿Qué situaciones han dificultado alguna vez tus compras? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Problemas de transporte', 'Clima o fenómenos naturales',
                    'Cortes de Internet', 'Cortes de electricidad',
                    'Falta de disponibilidad del producto',
                    'Incremento fuerte de precios',
                    'Problemas de seguridad',
                    'Problemas con plataformas digitales',
                    'Problemas con pagos', 'Falta de tiempo',
                    'Problemas de entrega', 'Ninguna importante', 'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            // ============================================================
            // BLOQUE 10
            // ============================================================
            steps.push({
                id: 'p20',
                question: '20. Si mañana dejara de funcionar el principal canal digital que utilizas para encontrar productos o servicios, ¿qué harías? (puedes seleccionar varias)',
                type: 'checkbox',
                options: opts([
                    'Buscaría en otra plataforma', 'Buscaría en Google',
                    'Contactaría directamente a vendedores conocidos',
                    'Iría a tiendas físicas', 'Preguntaría a conocidos',
                    'Buscaría en redes sociales alternativas',
                    'Esperaría a que volviera a funcionar',
                    'Me resultaría muy difícil encontrar alternativas', 'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            // ============================================================
            // BLOQUE 11 — GEOGRAFÍA (con lógica dinámica)
            // ============================================================
            steps.push({
                id: 'p21',
                question: '21. ¿En qué país realizas principalmente tus compras?',
                type: 'radio',
                options: opts([
                    'Perú', 'Argentina', 'Bolivia', 'Brasil', 'Chile',
                    'Colombia', 'Costa Rica', 'Ecuador', 'El Salvador',
                    'España', 'Guatemala', 'Honduras', 'México',
                    'Nicaragua', 'Panamá', 'Paraguay', 'Portugal',
                    'República Dominicana', 'Uruguay', 'Venezuela',
                    'Otro país'
                ]),
                allowOther: true,
                condition: () => true
            });

            const peruLocalidades = [
                'Lima Metropolitana / Callao', 'Arequipa', 'Trujillo',
                'Piura', 'Chiclayo', 'Cusco', 'Ica', 'Huaraz',
                'Chimbote', 'Nuevo Chimbote', 'Coishco', 'Santa',
                'Nepeña', 'Moro', 'Casma', 'Huarmey', 'Chao', 'Virú',
                'Otra localidad de Áncash',
                'Otra localidad de la costa peruana',
                'Otra localidad de la sierra peruana',
                'Otra localidad de la selva peruana',
                'Principalmente compro por Internet'
            ];

            // P22 — dinámica según país
            steps.push({
                id: 'p22',
                question: '22. ¿En qué localidad, ciudad o zona realizas principalmente tus compras?',
                getDefinition: () => {
                    if (answers.p21 === 'Perú') {
                        return {
                            type: 'radio',
                            hint: 'Selecciona la zona donde compras habitualmente.',
                            options: opts([...peruLocalidades, 'Otra:']),
                            allowOther: true
                        };
                    }
                    return {
                        type: 'text',
                        hint: `Escribe el nombre de tu ciudad o localidad (fuera de Perú).`,
                        placeholder: 'Ej. Santiago, Bogotá, São Paulo, Madrid...'
                    };
                },
                condition: () => true
            });

            // P23 — país de actividad
            steps.push({
                id: 'p23',
                question: '23. ¿En qué país realizas principalmente tu actividad laboral, comercial o profesional?',
                type: 'radio',
                options: opts([
                    'En el mismo país donde realizo mis compras',
                    'En otro país',
                    'Actualmente no realizo una actividad laboral/comercial',
                    'Mi actividad se desarrolla principalmente por Internet',
                    'Otro'
                ]),
                allowOther: true,
                condition: () => true
            });

            // P24 — dinámica + condicional
            steps.push({
                id: 'p24',
                question: '24. ¿En qué localidad, ciudad o zona realizas principalmente esa actividad?',

            // ================================================================
            // HELPERS
            // ================================================================
            function resolveStep(step) {
                if (!step) return null;
                if (typeof step.getDefinition === 'function') {
                    const def = step.getDefinition();
                    return Object.assign({}, step, def);
                }
                return step;
            }

            function detectarDispositivo() {
                const ua = navigator.userAgent;
                if (/tablet|ipad|playbook|silk/i.test(ua)) return 'tablet';
                if (/mobile|iphone|ipod|android|blackberry|windows phone/i.test(ua)) return 'celular';
                return 'laptop/PC';
            }

            function obtenerFuente() {
                const params = new URLSearchParams(window.location.search);
                const utm = params.get('utm_source');
                if (utm) return utm;
                try {
                    const ref = document.referrer || '';
                    if (ref.includes('facebook.com')) return 'Facebook';
                    if (ref.includes('messenger.com')) return 'Messenger';
                    if (ref.includes('whatsapp.com')) return 'WhatsApp';
                    if (ref.includes('instagram.com')) return 'Instagram';
                    if (ref.includes('tiktok.com')) return 'TikTok';
                    if (ref.includes('youtube.com')) return 'YouTube';
                    if (ref.includes('google.com')) return 'Google';
                    if (ref.includes('twitter.com')) return 'Twitter';
                    if (ref.includes('linkedin.com')) return 'LinkedIn';
                    if (ref.includes('web.telegram.org')) return 'Telegram';
                    return 'directo';
                } catch (e) { return 'desconocida'; }
            }

            function obtenerGeoData() {
                return fetch('https://ipapi.co/json/')
                    .then(r => r.ok ? r.json() : null)
                    .then(d => d ? {
                        ip: d.ip || 'desconocida',
                        ciudad: d.city || '',
                        region: d.region || '',
                        pais: d.country_name || '',
                        lat: d.latitude || null,
                        lon: d.longitude || null
                    } : null)
                    .catch(() => null);
            }

            function obtenerConexion() {
                const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                if (conn) return {
                    effectiveType: conn.effectiveType || 'unknown',
                    downlink: conn.downlink || null,
                    rtt: conn.rtt || null
                };
                return {};
            }

            // ================================================================
            // ENVÍO
            // ================================================================
            function enviarRespuestas(geo) {
                const dataToSend = {};
                for (const key in answers) {
                    if (answers[key] !== undefined && answers[key] !== null && answers[key] !== '') {
                        dataToSend[key] = answers[key];
                    }
                }

                const fin = new Date();
                dataToSend._metadata = {
                    fuente, dispositivo,
                    inicio: inicioEncuesta.toISOString(),
                    fin: fin.toISOString(),
                    tiempo_total_segundos: Math.round((fin - inicioEncuesta) / 1000),
                    tiempos_por_pregunta: tiemposPorPregunta,
                    conexion,
                    navegador: navigator.userAgent,
                    plataforma: navigator.platform || 'desconocida'
                };
                if (geo) dataToSend._geo = geo;

                return fetch('/api/encuesta', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ datos: dataToSend, token: NONCE })
                })
                .then(async res => {
                    if (!res.ok) {
                        const t = await res.text();
                        let msg;
                        try { msg = JSON.parse(t).error || `Error ${res.status}`; }
                        catch (e) { msg = `Error ${res.status}: ${t || res.statusText}`; }
                        throw new Error(msg);
                    }
                    const t = await res.text();
                    if (!t) return {};
                    try { return JSON.parse(t); } catch (e) { return { success: true }; }
                })
                .then(data => {
                    datosEnviados = true;
                    try { localStorage.setItem(STORAGE_KEY, 'true'); } catch (e) {}
                    return { success: true, data };
                })
                .catch(error => {
                    console.error('❌ Error al enviar:', error);
                    return { success: false, error: error.message };
                });
            }

            // ================================================================
            // NAVEGACIÓN
            // ================================================================
            let currentStepIndex = 0;

            function getVisibleSteps() { return steps.filter(s => s.condition()); }
            function getCurrentVisibleIndex() {
                const visible = getVisibleSteps();
                if (currentStepIndex >= visible.length) currentStepIndex = visible.length - 1;
                if (currentStepIndex < 0) currentStepIndex = 0;
                return currentStepIndex;
            }
            function getCurrentStep() {
                const visible = getVisibleSteps();
                return visible[getCurrentVisibleIndex()] || null;
            }

            function saveCurrentAnswer() {
                const step = getCurrentStep();
                if (!step) return;
                const el = document.querySelector(`[data-step-id="${step.id}"]`);
                if (!el) return;

                const effective = resolveStep(step);
                let value;

                if (effective.type === 'radio') {
                    const c = el.querySelector('input[type="radio"]:checked');
                    if (c) {
                        value = c.value;
                        if (value === 'Otra:' || value === 'Otro' || value === 'Otro país') {
                            const lbl = c.closest('label');
                            if (lbl) {
                                const ti = lbl.querySelector('.otro-input');
                                if (ti && ti.value.trim() !== '') {
                                    value = value + ' ' + ti.value.trim();
                                }
                            }
                        }
                    } else value = null;
                } else if (effective.type === 'checkbox') {
                    const cbs = el.querySelectorAll('input[type="checkbox"]:checked');
                    value = Array.from(cbs).map(cb => cb.value);
                    const otroInput = el.querySelector('.otro-input');
                    if (otroInput && otroInput.value.trim() !== '') {
                        const hasOtro = value.includes('Otro') || value.includes('Otra') || value.includes('Otros');
                        if (hasOtro) {
                            value = value.filter(v => v !== 'Otro' && v !== 'Otra' && v !== 'Otros');
                            value.push(otroInput.value.trim());
                        }
                    }
                } else {
                    const inp = el.querySelector('input, textarea');
                    value = inp ? inp.value : '';
                }
                if (value !== undefined) answers[step.id] = value;
            }

            function loadAnswer(step) {
                const el = document.querySelector(`[data-step-id="${step.id}"]`);
                if (!el) return;
                const val = answers[step.id];
                if (val === undefined) return;

                const effective = resolveStep(step);

                if (effective.type === 'radio') {
                    const radios = el.querySelectorAll('input[type="radio"]');
                    let found = false;
                    radios.forEach(r => {
                        if (r.value === val) { r.checked = true; found = true; }
                    });
                    // Reconstruir valor compuesto (ej. "Otra: Lima")
                    if (!found && typeof val === 'string') {
                        const match = val.match(/^(Otra:|Otro|Otro país)\s+(.+)$/);
                        if (match) {
                            const base = match[1];
                            const resto = match[2];
                            radios.forEach(r => {
                                if (r.value === base && !found) {
                                    r.checked = true;
                                    const lbl = r.closest('label');
                                    if (lbl) {
                                        const ti = lbl.querySelector('.otro-input');
                                        if (ti) ti.value = resto;
                                    }
                                    found = true;
                                }
                            });
                        }
                    }
                } else if (effective.type === 'checkbox') {
                    const cbs = el.querySelectorAll('input[type="checkbox"]');
                    cbs.forEach(cb => {
                        if (Array.isArray(val)) cb.checked = val.some(v => v === cb.value || (typeof v === 'string' && v.startsWith(cb.value)));
                    });
                    const otroInput = el.querySelector('.otro-input');
                    if (otroInput && Array.isArray(val)) {
                        const otroVal = val.find(v => typeof v === 'string' && !effective.options.some(o => o.value === v));
                        if (otroVal) otroInput.value = otroVal;
                    }
                } else {
                    const inp = el.querySelector('input, textarea');
                    if (inp) inp.value = val;
                }
            }

            function registrarTiempoPregunta(stepId) {
                if (preguntaActualId && inicioPregunta) {
                    tiemposPorPregunta[preguntaActualId] = Math.round((new Date() - inicioPregunta) / 1000);
                }
                preguntaActualId = stepId;
                inicioPregunta = new Date();
            }

            function renderStep() {
                const step = getCurrentStep();
                const area = document.getElementById('dynamicArea');
                if (!step) { showSummary(); return; }

                const effective = resolveStep(step);

                if (step.id !== preguntaActualId) registrarTiempoPregunta(step.id);

                const visible = getVisibleSteps();
                const idx = getCurrentVisibleIndex();
                document.getElementById('stepCounter').textContent = `Paso ${idx+1} de ${visible.length}`;
                const progress = ((idx) / (visible.length - 1)) * 100;
                document.getElementById('progressFill').style.width = (visible.length === 1 ? 100 : progress) + '%';

                let html = `<div class="question-area" data-step-id="${step.id}">`;
                html += `<div class="question-text">${step.question}`;
                if (effective.type === 'text' || effective.type === 'textarea') html += ` <span class="sub-label">(respuesta corta)</span>`;
                if (effective.maxSelections) html += ` <span class="sub-label">(máximo ${effective.maxSelections})</span>`;
                html += `</div>`;

                if (effective.hint) {
                    html += `<div class="info-hint">${effective.hint}</div>`;
                }

                const options = effective.options || [];

                if (effective.type === 'radio' || effective.type === 'checkbox') {
                    html += `<div class="options-group">`;
                    options.forEach(opt => {
                        html += `<label>`;
                        html += `<input type="${effective.type}" name="${step.id}" value="${opt.value}">`;
                        html += `<span>${opt.label}</span>`;
                        if ((opt.label === 'Otro' || opt.label === 'Otra' || opt.label === 'Otra:' || opt.label === 'Otro país') && effective.allowOther) {
                            html += `<input type="text" class="otro-input" placeholder="Especifica...">`;
                        }
                        html += `</label>`;
                    });
                    html += `</div>`;
                } else if (effective.type === 'text') {
                    html += `<input type="text" class="text-input" placeholder="${effective.placeholder || ''}">`;
                } else if (effective.type === 'textarea') {
                    html += `<textarea class="text-input textarea" placeholder="${effective.placeholder || ''}"></textarea>`;
                }

                html += `<div class="navigation">`;
                html += `<button class="btn btn-secondary" id="prevBtn" ${idx===0?'disabled':''}>← Anterior</button>`;
                html += (idx === visible.length - 1)
                    ? `<button class="btn btn-success" id="nextBtn">Enviar respuestas ✓</button>`
                    : `<button class="btn btn-primary" id="nextBtn">Siguiente →</button>`;
                html += `</div></div>`;
                area.innerHTML = html;

                loadAnswer(step);

                const nextBtn = document.getElementById('nextBtn');
                const prevBtn = document.getElementById('prevBtn');

                area.querySelectorAll('input, textarea').forEach(inp => {
                    inp.addEventListener('change', () => {
                        saveCurrentAnswer();
                        if (effective.type === 'radio') {
                            const condicionantes = ['p9','p13','p21','p23','p25','p37'];
                            if (condicionantes.includes(step.id)) {
                                const vis = getVisibleSteps();
                                const ni = vis.findIndex(s => s.id === step.id);
                                if (ni !== -1) currentStepIndex = ni;
                                renderStep();
                            }
                        }
                    });
                    inp.addEventListener('blur', saveCurrentAnswer);
                });

                nextBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    saveCurrentAnswer();
                    const s = getCurrentStep();
                    if (!s) return;
                    const eff = resolveStep(s);

                    if (eff.type === 'radio' && !answers[s.id]) { alert('Selecciona una opción.'); return; }
                    if (eff.type === 'checkbox') {
                        const v = answers[s.id];
                        if (!v || !Array.isArray(v) || v.length === 0) { alert('Selecciona al menos una opción.'); return; }
                        if (eff.maxSelections && v.length > eff.maxSelections) { alert(`Máximo ${eff.maxSelections} opciones.`); return; }
                    }
                    if ((eff.type === 'text' || eff.type === 'textarea') && (!answers[s.id] || String(answers[s.id]).trim() === '')) {
                        alert('Escribe tu respuesta.'); return;
                    }

                    const vis = getVisibleSteps();
                    if (currentStepIndex === vis.length - 1) {
                        nextBtn.disabled = true;
                        nextBtn.textContent = 'Enviando...';
                        registrarTiempoPregunta(s.id);

                        (geoData ? Promise.resolve(geoData) : obtenerGeoData().then(g => geoData = g))
                            .then(g => enviarRespuestas(g))
                            .then(showSummary);
                        return;
                    }
                    registrarTiempoPregunta(s.id);
                    currentStepIndex++;
                    renderStep();
                });

                prevBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    if (currentStepIndex > 0) {
                        const s = getCurrentStep();
                        if (s) registrarTiempoPregunta(s.id);
                        currentStepIndex--;
                        renderStep();
                    }
                });
            }

            // ================================================================
            // RESUMEN
            // ================================================================
            function showSummary(envioResult) {
                const area = document.getElementById('dynamicArea');
                saveCurrentAnswer();
                const allAnswers = { ...answers };
                const visibleSteps = getVisibleSteps();
                const exito = envioResult && envioResult.success;

                let html = `<div class="summary">`;

                if (exito) {
                    html += `<div class="alert alert-success" style="text-align:center; font-size:18px;">
                                ✅ ¡Encuesta enviada correctamente! Muchas gracias por tu tiempo.
                                <p style="margin-top:12px; font-size:16px; color:#5b6f82;">Tus respuestas han sido registradas.</p>
                            </div>`;
                } else {
                    if (envioResult) {
                        html += `<div class="alert alert-error">❌ Error al enviar: ${envioResult.error}.<br>Tus respuestas se guardaron localmente.</div>`;
                    } else {
                        html += `<div class="alert alert-info">⚠️ Aún no has enviado los datos.</div>`;
                    }

                    html += `<h3 style="margin-bottom:16px; font-weight:600;">Resumen de tus respuestas</h3>`;
                    visibleSteps.forEach(step => {
                        const val = allAnswers[step.id];
                        if (!val || (Array.isArray(val) && val.length === 0) || (typeof val === 'string' && val.trim() === '')) return;
                        html += `<div class="summary-item"><strong>${step.question}</strong>`;
                        if (Array.isArray(val)) {
                            html += `<div class="answer multi">`;
                            val.forEach(v => html += `<span>${v}</span>`);
                            html += `</div>`;
                        } else {
                            html += `<div class="answer">${val}</div>`;
                        }
                        html += `</div>`;
                    });

                    html += `<div style="margin-top:24px; display:flex; gap:12px;">
                                <button class="btn btn-secondary" id="backBtn">← Volver</button>
                                <button class="btn btn-primary" id="restartBtn" style="flex:1;">🔁 Nueva encuesta</button>
                             </div>`;
                }
                html += `</div>`;
                area.innerHTML = html;

                document.getElementById('progressFill').style.width = '100%';
                document.getElementById('stepCounter').textContent = exito ? '¡Completado!' : 'Resumen';

                if (!exito) {
                    const back = document.getElementById('backBtn');
                    const restart = document.getElementById('restartBtn');
                    if (back) back.addEventListener('click', () => {
                        const v = getVisibleSteps();
                        if (v.length) { currentStepIndex = v.length - 1; renderStep(); }
                    });
                    if (restart) restart.addEventListener('click', () => {
                        for (const k in answers) delete answers[k];
                        datosEnviados = false;
                        currentStepIndex = 0;
                        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
                        renderStep();
                    });
                }
            }

            // ================================================================
            // INICIO
            // ================================================================
            function init() {
                try {
                    if (localStorage.getItem(STORAGE_KEY) === 'true') {
                        const area = document.getElementById('dynamicArea');
                        area.innerHTML = `
                            <div class="alert alert-info" style="margin-top:40px; text-align:center; font-size:18px;">
                                <p>✅ Ya has completado esta encuesta anteriormente.</p>
                                <p style="margin-top:12px; font-size:16px; color:#5b6f82;">Gracias por tu participación.</p>
                            </div>`;
                        document.getElementById('stepCounter').textContent = 'Completado';
                        document.getElementById('progressFill').style.width = '100%';
                        return;
                    }
                } catch (e) {}

                fuente = obtenerFuente();
                dispositivo = detectarDispositivo();
                conexion = obtenerConexion();

                obtenerGeoData().then(g => geoData = g).catch(() => geoData = null);

                preguntaActualId = null;
                inicioPregunta = new Date();
                currentStepIndex = 0;
                datosEnviados = false;
                renderStep();
            }

            window.addEventListener('load', init);
        })();
    </script>
</body>
</html>
